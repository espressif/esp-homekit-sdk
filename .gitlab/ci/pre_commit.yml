.check_pre_commit_template:
  stage: check
  image: $ESP_DOCS_ENV_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - apk add --no-cache git
    - python -m pip install --no-cache-dir pre-commit
    # CI_MERGE_REQUEST_TARGET_BRANCH_NAME is only set in merge-request pipelines
    - DIFF_BASE_BRANCH=${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-master}
    - git fetch origin $DIFF_BASE_BRANCH --depth=1
    - git fetch origin $CI_COMMIT_REF_NAME --depth=1
    - |
      echo "Target branch: $DIFF_BASE_BRANCH"
      echo "Source branch: $CI_COMMIT_REF_NAME"

      MODIFIED_FILES=$(git diff --name-only origin/$DIFF_BASE_BRANCH..origin/$CI_COMMIT_REF_NAME)
      echo "Modified files to check:"
      echo "$MODIFIED_FILES"

      if [ -n "$MODIFIED_FILES" ]; then
          CI=true pre-commit run --files $MODIFIED_FILES
      else
          echo "No modified files to check."
      fi

check_pre_commit:
  extends:
    - .check_pre_commit_template
